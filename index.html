<!DOCTYPE html><html>
<head>
<title>Happy Birthday ️Honey</title><style>

body{
font-family:Arial;
background:#ffe6f0;
text-align:center;
margin:0;
}

h1{
margin-top:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
padding:20px;
}

.card{
width:150px;
height:200px;
perspective:1000px;
margin:auto;
cursor:pointer;
}

.inner{
position:relative;
width:100%;
height:100%;
transition:transform 0.6s;
transform-style:preserve-3d;
}

.card.flipped .inner{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:10px;
overflow:hidden;
backface-visibility:hidden;
display:flex;
align-items:center;
justify-content:center;
}

.front img{
width:100%;
height:100%;
object-fit:cover;
}

.back{
background:#ff4da6;
color:white;
transform:rotateY(180deg);
padding:20px;
text-align:left;
line-height:1.4;
}

/* popup style */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
align-items:center;
justify-content:center;
}

.popup-card{
width:300px;
height:420px;
perspective:1000px;
}

function openCard(img,text){

document.getElementById("popup").style.display="flex"

document.getElementById("popupImg").src=img

document.getElementById("popupText").innerText=text

setTimeout(()=>{
document.getElementById("popupCard").classList.add("flipped")
},200)

}

function closeCard(){

document.getElementById("popup").style.display="none"

document.getElementById("popupCard").classList.remove("flipped")

}

</html>
